<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Data picker</title>
</head>
<body>
    <form class="formulario">

        <label class="formulario__label" for="date">selecciona la fecha:</label>
        <div class="formulario__input-container">
            <input class="formulario__input" type="text" id="date" name="date" placeholder="DD/MM/YYYY">
            <button class="formulario__input-button" type="button">&#128197;</button>
        </div>

        <div class="calendario">
            <div class="calendario__header">
                <span class="calendario__prev">&#10094;</span>
                <div class="calendario__month-year">
                    <span class="calendario__month">December</span>
                    <span class="calendario__year">2022</span>
                </div>
                <span class="calendario__next">&#10095;</span>
            </div>
            <div class="calendario__body">
                <div class="calendario__weekdays">
                    <span>Dom</span>
                    <span>Lun</span>
                    <span>Mar</span>
                    <span>Mie</span>
                    <span>Jue</span>
                    <span>Vie</span>
                    <span>Sab</span>
                </div>
                <div class="calendario__days">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                    <span>6</span>
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                    <span>10</span>
                    <span>11</span>
                    <span>12</span>
                    <span>13</span>
                    <span>14</span>
                    <span>15</span>
                    <span>16</span>
                    <span>17</span>
                    <span>18</span>
                    <span>19</span>
                    <span>20</span>
                    <span>21</span>
                    <span>22</span>
                    <span>23</span>
                    <span>24</span>
                    <span>25</span>
                    <span>26</span>
                    <span>27</span>
                    <span>28</span>
                    <span>29</span>
                    <span>30</span>
                    <span>31</span>
                </div>
            </div>
        </div>
    </form>
</body>
</html>
