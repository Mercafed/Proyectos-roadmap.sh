<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form UI</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <h2 class="main__title">actualiza tus datos</h2>
      <div class="info">
        <object class="info__loading" data="assets/loading.svg" type="image/svg+xml"></object>
        <h3 class="info__title">lista de tareas</h3>
        <ul class="info__list">
          <li class="completed">crear cuenta</li>
          <li>actualizar perfil</li>
          <li>completa tareas</li>
          <li>invitar amigos</li>
        </ul>
      </div>
      <form class="form">
        <label for="name">Nombre Completo:</label>
        <input type="text" id="name" name="name" placeholder="nombre completo" required />

        <label class="form__emailLabel" for="email">Correo Electrónico:</label>
        <input class="form__email" type="email" id="email" name="email" placeholder="Ingresa tu correo" required />

        <div class="form__notif">
          <p>el correo ya existe</p>
        </div>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="contraseña" required />

        <label for="confirm-password">Confirmar Contraseña:</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirma tu contraseña"
          required
        />
        <button type="submit">Actualizar Perfil</button>
      </form>
    </main>
  </body>
</html>
