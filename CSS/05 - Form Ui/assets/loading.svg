<svg width="100" height="100" viewBox="0 0 100 100" fill="transparent" xmlns="http://www.w3.org/2000/svg">
    <circle
        cx="50" cy="50" r="40" 
        stroke="#757575" stroke-width="5" fill="transparent"/>

    <circle
        class="loading-circle"
        cx="50" cy="50" r="40" 
        stroke="#000" stroke-width="5" fill="transparent" 
        stroke-dasharray="251.32" 
        stroke-dashoffset="188.49" stroke-linecap="round" />


    <text
        class="loading-text"
        x="50" y="50" text-anchor="middle" font-size="20" fill="#000" alignment-baseline="middle">25%</text>

    <style>
        .loading-circle {
            transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }

        .loading-text {
            font-family: sistem-ui, sans-serif;
        }
    </style>
</svg>